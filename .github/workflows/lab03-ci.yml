name: Lab 03 CI

on:
  push:
    branches: [main, 'java/**']
    paths:
      - '.github/workflows/lab03-ci.yml'
      - '.gitattributes'
      - 'LAB_03/pom.xml'
      - 'LAB_03/.mvn/**'
      - 'LAB_03/mvnw'
      - 'LAB_03/mvnw.cmd'
      - 'LAB_03/src/**'
      - 'LAB_03/data/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lab03-ci.yml'
      - '.gitattributes'
      - 'LAB_03/pom.xml'
      - 'LAB_03/.mvn/**'
      - 'LAB_03/mvnw'
      - 'LAB_03/mvnw.cmd'
      - 'LAB_03/src/**'
      - 'LAB_03/data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab03-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Java 21)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: LAB_03

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            LAB_03/pom.xml
            LAB_03/.mvn/wrapper/maven-wrapper.properties

      - name: Verify with Maven Wrapper (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress -Dbuild.number="$GITHUB_RUN_NUMBER" clean verify

      - name: Verify with Maven Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\mvnw.cmd --batch-mode --no-transfer-progress "-Dbuild.number=$env:GITHUB_RUN_NUMBER" clean verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run packaged application
        shell: bash
        run: |
          java -jar target/*-all.jar > target/smoke.txt
          java -jar target/*-all.jar --help > target/help.txt
          version="$(java -jar target/*-all.jar --version)"
          version="${version//$'\r'/}"
          printf '%s\n' "$version" | tee target/version.txt
          [[ "$version" == *"+$GITHUB_RUN_NUMBER" ]]

      - name: Upload executable JAR and CLI output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lab03-${{ matrix.os }}-java21
          path: |
            LAB_03/target/*-all.jar
            LAB_03/target/smoke.txt
            LAB_03/target/help.txt
            LAB_03/target/version.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload test and static analysis reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lab03-reports-${{ matrix.os }}
          path: |
            LAB_03/target/surefire-reports/**
            LAB_03/target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 7
